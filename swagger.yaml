components:
  schemas:
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
        provided_by:
          type: integer
      required:
        - file
        - id
        - provided_by
    AttachmentRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        provided_by:
          type: integer
      required:
        - file
        - provided_by
    BiologicalEvidence:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        images:
          type: array
          items:
            type: integer
        title:
          type: string
          maxLength: 50
        description:
          type: string
        seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
        location:
          type: string
          maxLength: 200
        result:
          type: string
          nullable: true
        case:
          type: integer
          nullable: true
        created_by:
          type: integer
        coronary:
          type: integer
          nullable: true
      required:
        - created_at
        - created_by
        - description
        - id
        - images
        - location
        - seen_at
        - title
    BiologicalEvidenceRequest:
      type: object
      properties:
        images:
          type: array
          items:
            type: integer
        title:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
          minLength: 1
        seen_at:
          type: string
          format: date-time
        location:
          type: string
          minLength: 1
          maxLength: 200
        result:
          type: string
          nullable: true
        case:
          type: integer
          nullable: true
        created_by:
          type: integer
        coronary:
          type: integer
          nullable: true
      required:
        - created_by
        - description
        - images
        - location
        - seen_at
        - title
    BlankEnum:
      enum:
        - ""
    Case:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_from_crime_scene:
          type: boolean
        is_closed:
          type: boolean
        crime:
          type: integer
          nullable: true
        detective:
          type: integer
          nullable: true
      required:
        - created_at
        - id
    CaseDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        detective_details:
          allOf:
            - $ref: "#/components/schemas/User"
          readOnly: true
        crime_details:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_from_crime_scene:
          type: boolean
        is_closed:
          type: boolean
        crime:
          type: integer
          nullable: true
        detective:
          type: integer
          nullable: true
      required:
        - created_at
        - crime_details
        - detective_details
        - id
    CaseList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_from_crime_scene:
          type: boolean
        is_closed:
          type: boolean
        detective_name:
          type: string
          readOnly: true
        crime_title:
          type: string
          readOnly: true
      required:
        - created_at
        - crime_title
        - detective_name
        - id
    CaseReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reported_at:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/StatusC60Enum"
        rejection_reason:
          type: string
          nullable: true
        reporter:
          type: integer
        case:
          type: integer
        reviewed_by:
          type: integer
          nullable: true
      required:
        - case
        - id
        - reported_at
        - reporter
    CaseReportCreate:
      type: object
      properties:
        reporter:
          type: integer
        case:
          type: integer
        description:
          type: string
          nullable: true
      required:
        - case
        - reporter
    CaseReportCreateRequest:
      type: object
      properties:
        reporter:
          type: integer
        case:
          type: integer
        description:
          type: string
          nullable: true
          minLength: 1
      required:
        - case
        - reporter
    CaseReportDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reporter_details:
          allOf:
            - $ref: "#/components/schemas/User"
          readOnly: true
        reviewed_by_details:
          allOf:
            - $ref: "#/components/schemas/User"
          readOnly: true
        reported_at:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/StatusC60Enum"
        rejection_reason:
          type: string
          nullable: true
        reporter:
          type: integer
        case:
          type: integer
        reviewed_by:
          type: integer
          nullable: true
      required:
        - case
        - id
        - reported_at
        - reporter
        - reporter_details
        - reviewed_by_details
    CaseReportRequest:
      type: object
      properties:
        description:
          type: string
          nullable: true
          minLength: 1
        status:
          $ref: "#/components/schemas/StatusC60Enum"
        rejection_reason:
          type: string
          nullable: true
        reporter:
          type: integer
        case:
          type: integer
        reviewed_by:
          type: integer
          nullable: true
      required:
        - case
        - reporter
    CaseReportReview:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/CaseReportReviewStatusEnum"
        rejection_reason:
          type: string
          nullable: true
      required:
        - status
    CaseReportReviewRequest:
      type: object
